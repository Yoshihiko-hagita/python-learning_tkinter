name: Auto Merge

on:
  push:
    branches:
      - feature/tkinter

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Merge feature into main
        run: |
          git fetch origin

          git checkout main

          git merge origin/feature/tkinter --no-edit

          git push origin main
